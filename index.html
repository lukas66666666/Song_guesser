<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verse</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Verse</h1>
        <p>Find the song stuck in your head.</p>
    </header>
    <main>
        <div id="searchContainer">
            <input type="text" id="songInput" placeholder="Enter your lyrics">
            <button id="submitBtn">Submit</button>
        </div>
        <div id="results">
            <div id="placeholder">
                <div class="placeholderResult lowerResult">
                    <div class="placeholderImg"></div>
                    <div class="placeholderName"></div>
                    <div class="placeholderArtist"></div>
                </div>
                <div class="placeholderResult">
                    <div class="placeholderImg"></div>
                    <div class="placeholderName"></div>
                    <div class="placeholderArtist"></div>
                </div>
                <div class="placeholderResult lowerResult">
                    <div class="placeholderImg"></div>
                    <div class="placeholderName"></div>
                    <div class="placeholderArtist"></div>
                </div>
            </div>
        </div>
        <button id="allResultsBtn">See all results</button>
        <div id="bgBlur">
            <div id="allResultsContainer">
                <button id="closeBtn">x</button>
                <div id="allResults">
                </div>
            </div>
        </div>
    </main>
    <script src="src/main.js"></script>
</body>
</html>
